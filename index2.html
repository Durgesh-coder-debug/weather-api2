<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{
            background: linear-gradient(195deg,#6D28D9,#2563EB,#06B6D4,#2193B0,#6DD5ED, #6D28D9);
            background-size: 200% 200%;
            animation: myname 4s ease-in 3s infinite;
        }
        @keyframes myname {
    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}
h1{
    margin-left:42%;
    font-family: Arial, Helvetica, sans-serif;
    font-size:38px;
    color:greenyellow;
    font-weight: bolder;
}
     input{
        margin-top:4%;
        margin-left:40%;
        height:36px;
        width:300px;
        border:none;
        border:2px solid rgba(255, 0, 0, 0.737);
        color:orange;
        outline:none;
        display:block;
     }
     .input:focus{
        border:2px solid rgba(255, 0, 0, 0.737);
     }
     .btn{
       display: inline-block;
        height:47px;
        width:160px;
        border-radius:20px;
        border:none;
        background-color:red;
        color:white;
        transition:all 0s ease-in-out 0s;
        margin-left:45%;
        margin-top:2%;
     }
     .reset{
        display: inline-block;
        height:47px;
        width:160px;
        border-radius:20px;
        border:none;
        background-color:red;
        color:white;
        transition:all 0s ease-in-out 0s;
        margin-left:45%;
        margin-top:2%;
     }
     button:hover{
        cursor: pointer;
        box-shadow:5px 3px 0px 0px rgba(0,0,0,0.08);
        transform:scale(1.02);
     }
     .container{
        height:400px;
        width:800px;
        background-color:orange;
        margin-left:350px;
        margin-top:3%;
     }
     #heading{
          color:rgb(238, 0, 255);
          text-align:center;
          margin-right:25px;
          font-size:30px;
          position:relative;
          top:10px;
     }
     .box{
        background-color:lightcoral;
        height:90px;
        width:800px;
        margin:20px;
        position: relative;
        right:19px;
     }
     h4{
       color:#4721b0;
       position:relative;
       top:30px;
       left:240px;
     }
     h5{
        position: relative;
        top:-20px;
        left:400px;
        font-size:18px;
        color:black;
     }
     #lt{
       position: relative;
       left:240px;
     }
     #lt1{
         position: relative;
       left:260px;
     }
    </style>
    <title>Document</title>
</head>
<body>
    <h1>Weather API</h1>
    <label for="id1"></label>
   <input type="text" placeholder="Enter Your Country Name">
   <button class="btn">Search</button>
   <button class="reset">Reset</button>
   <div class="container">
   <h3 id="heading">History</h3>
   <div class="box">
    <h4>COUNTRY NAME:</h4>
    <h5 id="box1"></h5>
   </div>
   <div class="box">
    <h4 id="lt1">CAPITAL NAME:</h4>
    <h5 id="box2"></h5>
   </div>
   <div class="box">
    <h4 id="lt">LOCALTIME LAPSE:</h4>
    <h5 id="box3"></h5>
   </div>
   </div>

   <script src="first2.js"></script>
</body>
</html>
